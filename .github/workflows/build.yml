name: Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      # A step's `if:` can't reference `secrets` directly (only env/github/
      # etc. are allowed there) — stash whether the cert secret is set into
      # $GITHUB_ENV here, in a step whose *env:* block can see secrets, so
      # later steps can gate on `env.HAS_DEVELOPER_ID` instead.
      - name: Check for Developer ID secret
        env:
          HAS_CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
        run: echo "HAS_DEVELOPER_ID=$HAS_CERT" >> "$GITHUB_ENV"

      # Tag pushes (v0.1.1, v0.1.1-rc1, v0.1.1-pre0, ...): stamp Info.plist to
      # the tag's exact version.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $TAG_VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist

      # Everything else (push to main, or a manual run): stamp an auto-incrementing
      # dev version instead, e.g. 0.1.0-dev.42, so every build is uniquely numbered.
      - name: Set dev version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          CURRENT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${CURRENT_VERSION}-dev.${{ github.run_number }}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist

      # Release builds only, and only once DEVELOPER_ID_CERT_P12 is set as a
      # repo secret (base64 of a .p12 export containing the Developer ID
      # Application cert + private key). Until then this step is skipped
      # and build-app.sh falls back to ad-hoc signing, same as local dev.
      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_DEVELOPER_ID == 'true'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "${{ secrets.DEVELOPER_ID_CERT_P12 }}" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prepend the new keychain to the search list rather than
          # replacing it, so codesign can still find the runner's other
          # (unrelated) default keychains if it needs to. A plain
          # while-read loop avoids both the word-splitting issue of a bare
          # unquoted $(...) expansion and mapfile, which doesn't exist in
          # bash 3.2 — what macOS's default /bin/bash still is (Apple
          # hasn't shipped a newer one since bash went GPLv3). Confirmed
          # by an actual CI failure: "mapfile: command not found".
          EXISTING_KEYCHAINS=()
          while IFS= read -r keychain; do
            EXISTING_KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | sed 's/^ *"//;s/" *$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build .app
        run: scripts/build-app.sh

      # Same secret gate as the import step above — skips cleanly until
      # notarization credentials are actually configured, leaving an
      # ad-hoc-signed (unnotarized) build as the release asset in the
      # meantime.
      - name: Notarize
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_DEVELOPER_ID == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "${{ secrets.ASC_API_KEY_P8 }}" > "$RUNNER_TEMP/asc-key.p8"
          ASC_API_KEY_P8="$RUNNER_TEMP/asc-key.p8" scripts/notarize.sh
          rm -f "$RUNNER_TEMP/asc-key.p8"

      # ditto (not plain zip) preserves the bundle's resource forks/xattrs
      # correctly — the standard way to zip a macOS .app for distribution.
      # Runs after notarization so the zipped app carries the stapled
      # ticket when notarization ran.
      - name: Zip app bundle
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent DACSync.app DACSync-macOS.zip

      - name: Clean up signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.keychain-db" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/asc-key.p8"

      # Always uploaded as a workflow artifact — the release job (tag
      # pushes only) downloads this rather than each platform trying to
      # create/attach to the release independently, which would race.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DACSync-macOS
          path: build/DACSync-macOS.zip

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/DACSync.Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Same versioning scheme as the macOS job: exact tag version for
      # releases, an auto-incrementing dev version otherwise.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set dev version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: echo "APP_VERSION=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release -p:Version=${{ env.APP_VERSION }}

      # Self-contained so it runs on a Windows machine with no .NET
      # runtime installed — matches how the macOS build is a standalone
      # .app with no external dependency either.
      - name: Publish
        run: dotnet publish -r win-x64 --self-contained -c Release -o publish -p:Version=${{ env.APP_VERSION }}

      - name: Zip published output
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath DACSync-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DACSync-windows
          path: windows/DACSync.Windows/DACSync-windows.zip

  # Tag pushes only: both platform builds land here, get renamed to their
  # final release filenames, and go on a single GitHub Release together —
  # one job per platform trying to create/attach to the same release
  # independently would race, since they run in parallel.
  #
  # NOTE: the Windows build has not been runtime-verified on an actual
  # Windows machine (see windows/README.md) — it's attached here on the
  # strength of "compiles and publishes cleanly," not "confirmed working."
  release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: DACSync-macOS
          path: macos

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: DACSync-windows
          path: windows

      # Tag pushes (v0.1.1, v0.1.1-rc1, v0.1.1-pre0, ...): mark the Release
      # as a prerelease whenever the tag has a prerelease suffix (anything
      # after a hyphen).
      - name: Determine release type
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "PRERELEASE_FLAG=--prerelease" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE_FLAG=" >> "$GITHUB_ENV"
          fi

      # Notes auto-generated from commits since the last tag (GitHub's
      # built-in "What's Changed" + full changelog link — no changelog
      # file to maintain).
      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2086
          # $PRERELEASE_FLAG must stay unquoted: empty needs to vanish as
          # an argument entirely, not pass through as a literal empty
          # string (which would break gh's argument parsing).
          gh release create "$GITHUB_REF_NAME" \
            macos/DACSync-macOS.zip \
            windows/DACSync-windows.zip \
            --repo "${{ github.repository }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE_FLAG

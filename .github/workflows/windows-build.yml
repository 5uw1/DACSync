name: Windows Build

on:
  push:
    branches:
      - main
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/DACSync.Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release

      # Self-contained so it runs on a Windows machine with no .NET
      # runtime installed — matches how the macOS build is a standalone
      # .app with no external dependency either.
      - name: Publish
        run: dotnet publish -r win-x64 --self-contained -c Release -o publish

      - name: Zip published output
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath DACSync-windows.zip

      # Not yet attached to GitHub Releases (unlike the macOS build) —
      # this hasn't been runtime-verified on real Windows hardware. In
      # particular PolicyConfig.cs's undocumented COM interface (device
      # switching) and the WASAPI exclusive-mode probe are unverified;
      # see windows/README.md. Wire this into the release flow once
      # someone's actually run it on Windows and confirmed it works.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DACSync-windows
          path: windows/DACSync.Windows/DACSync-windows.zip
